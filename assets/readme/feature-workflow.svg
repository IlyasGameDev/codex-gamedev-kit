<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">A daily reward, in three steps</title>
  <desc id="desc">Example workflow: inspect saved state and currency code, build claim logic and save progress, then test repeated taps and game restarts. Fix and retest as needed.</desc>
  <rect x="1" y="1" width="1438" height="618" rx="28" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="64" y="66" font-size="21" font-weight="500" letter-spacing="2" fill="#2563eb">EXAMPLE WORKFLOW</text>
    <text x="64" y="130" font-size="53" font-weight="500" letter-spacing="-1.4" fill="#17191d">A daily reward, in three steps.</text>
    <path d="M110 264H1096" fill="none" stroke="#e5e7eb" stroke-width="2"/>
    <g fill="#ffffff" stroke="#d2d6dc" stroke-width="2">
      <circle cx="110" cy="264" r="33"/>
      <circle cx="590" cy="264" r="33"/>
      <circle cx="1070" cy="264" r="33"/>
    </g>
    <g fill="#2563eb" text-anchor="middle" font-size="25" font-weight="500">
      <text x="110" y="273">01</text>
      <text x="590" y="273">02</text>
      <text x="1070" y="273">03</text>
    </g>
    <g fill="#17191d" font-size="38" font-weight="500">
      <text x="77" y="361">Inspect</text>
      <text x="557" y="361">Build</text>
      <text x="1037" y="361">Test</text>
    </g>
    <g fill="#606772" font-size="29">
      <text x="77" y="412">Read saved state</text>
      <text x="77" y="453">and currency code.</text>
      <text x="557" y="412">Add claim logic</text>
      <text x="557" y="453">and save progress.</text>
      <text x="1037" y="412">Check repeat taps</text>
      <text x="1037" y="453">and game restarts.</text>
    </g>
    <g fill="none" stroke="#b7cdfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1250 501v29a12 12 0 0 1-12 12H602a12 12 0 0 1-12-12v-29m-8 10 8-10 8 10"/>
    </g>
    <rect x="811" y="520" width="220" height="43" fill="#ffffff"/>
    <text x="921" y="550" font-size="27" text-anchor="middle" fill="#606772">Fix and retest</text>
  </g>
</svg>
